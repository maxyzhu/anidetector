<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AniDetector{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --ink:#e6e8eb; --muted:#8b93a1;
            --animal:#22c55e; --person:#ef4444; --vehicle:#3b82f6; --species:#a855f7; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    header { padding:20px 28px; border-bottom:1px solid #23262e; }
    h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:.2px; }
    .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    nav { margin-top:12px; display:flex; gap:16px; }
    nav a { color:var(--muted); text-decoration:none; font-size:13px; }
    nav a:hover, nav a.active { color:var(--ink); }
    nav .soon { color:#4b515e; font-size:13px; }
    .filters { padding:16px 28px; display:flex; gap:10px; flex-wrap:wrap; }
    .filters a { color:var(--ink); text-decoration:none; font-size:13px;
                 padding:6px 12px; border:1px solid #2a2e37; border-radius:999px; }
    .filters a:hover { border-color:#3a3f4b; }
    .grid { padding:16px 28px 40px; display:grid;
            grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; }
    .card { background:var(--card); border:1px solid #23262e; border-radius:12px;
            overflow:hidden; }
    .card img { width:100%; display:block; background:#000; }
    .meta { padding:12px 14px; }
    .row { display:flex; align-items:center; justify-content:space-between; }
    .id { font-size:12px; color:var(--muted); }
    .info { margin-top:6px; font-size:12px; color:var(--muted); }
    .tags { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
    .tag { font-size:11px; padding:3px 8px; border-radius:999px; color:#0b0d10;
           font-weight:600; }
    .tag.animal { background:var(--animal); }
    .tag.person { background:var(--person); }
    .tag.vehicle{ background:var(--vehicle); }
    .tag.species { background:var(--species); color:#fff; }
    .empty { color:var(--muted); padding:40px 28px; }
    /* Hover help. In base rather than each page's styles block because the
       threshold form is one include shared by two pages. */
    /* The label text and its `?` must be one flex item, or the column layout
       of form.filterbar label stacks them on separate lines. */
    .help-label { display:inline-flex; align-items:center; white-space:nowrap; }
    .help { position:relative; display:inline-block; margin-left:5px;
            width:13px; height:13px; border:1px solid #3a3f4b; border-radius:50%;
            color:var(--muted); font-size:9px; line-height:12px; text-align:center;
            cursor:help; font-weight:600; }
    .help:hover, .help:focus { border-color:#5a6070; color:var(--ink); outline:none; }
    .help .tip { visibility:hidden; opacity:0; position:absolute; z-index:30;
                 left:50%; top:19px; transform:translateX(-50%); width:250px;
                 padding:9px 11px; border-radius:8px; background:#0b0d10;
                 border:1px solid #2a2e37; color:var(--ink); font-weight:400;
                 font-size:11.5px; line-height:1.55; text-align:left;
                 white-space:normal; box-shadow:0 6px 20px rgba(0,0,0,.55);
                 transition:opacity .12s; }
    .help:hover .tip, .help:focus .tip { visibility:visible; opacity:1; }
    .fieldnote { flex-basis:100%; margin:2px 0 0; font-size:11px; color:var(--muted); }
    {% block styles %}{% endblock %}
  </style>
</head>
<body>
  <header>
    <h1>{% block heading %}AniDetector{% endblock %}</h1>
    <div class="sub">{% block subtitle %}{% endblock %}</div>
    <nav>
      <a href="{% url 'home' %}" class="{% block nav_home %}{% endblock %}">Home</a>
      <a href="{% url 'results' %}" class="{% block nav_results %}{% endblock %}">Images</a>
      <a href="{% url 'video-tracks' %}" class="{% block nav_video %}{% endblock %}">Video</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
